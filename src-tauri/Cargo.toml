[package]
name = "lifeos-command-center"
version = "0.1.0"
description = "LifeOS Command Center"
authors = ["LifeOS"]
edition = "2021"

[lib]
name = "lifeos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "cookies", "multipart", "stream"] }
reqwest_cookie_store = "0.8"
cookie_store = "0.21"
rfd = "0.15"
ring = "0.17"
regex = "1"
scraper = "0.20"
ical = "0.11"
url = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
tauri-winrt-notification = "0.8.1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }
